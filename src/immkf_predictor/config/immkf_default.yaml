immkf_node:
  ros__parameters:
    # Subscription/Publication
    input_topic: "/fused_detections"
    output_topic: "/predicted_trajectories"
    frame_id: "camera_init"

    # Prediction parameters
    prediction:
      horizon_seconds: 0.5          # Total prediction time
      output_step_interval_hz: 10   # Publish rate
      internal_update_hz: 100       # Filter internal update rate

    # Motion models - Process noise
    models:
      constant_velocity:
        process_noise_pos: 0.01
        process_noise_vel: 0.01

      constant_acceleration:
        process_noise_pos: 0.01
        process_noise_vel: 0.1
        process_noise_acc: 0.01

      singer_model:
        process_noise_pos: 0.01
        process_noise_vel: 0.1
        process_noise_acc: 0.01
        decay_rate: 0.95            # Maneuver decay rate

    # Measurement parameters
    measurement:
      position_noise: 0.2           # LiDAR detection position std (m)
      velocity_prior_noise: 2.0     # Trust in estimated velocity

    # Data association
    association:
      max_distance_threshold: 2.0   # Association distance threshold (m)
      max_assignment_cost: 5.0

    # Track management
    tracking:
      init_frames: 3                # Frames to initialize
      confirm_frames: 5             # Frames to confirm track
      delete_frames: 10             # Frame threshold for deletion

    # IMM interconnection
    imm:
      initial_model_probs: [0.33, 0.33, 0.34]
      mode_transition_matrix:
        - [0.95, 0.025, 0.025]
        - [0.025, 0.95, 0.025]
        - [0.025, 0.025, 0.95]

    # Confirmation threshold
    confirmation_threshold: 5
    max_track_age: 100
    max_association_distance: 2.0
