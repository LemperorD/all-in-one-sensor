sensor_fusion_node:
  ros__parameters:
    # DBSCAN parameters
    dbscan_eps: 0.15           # Distance threshold for clustering (meters)
    dbscan_min_pts: 5          # Minimum points to form a cluster

    # IoU threshold for matching detection with cluster
    iou_threshold: 0.3         # 2D IoU threshold (0.0 - 1.0)

    # Camera intrinsic parameters (adjust based on your camera calibration)
    camera_fx: 1470.0          # Focal length in x (pixels)
    camera_fy: 1470.0          # Focal length in y (pixels)
    camera_cx: 480.0           # Principal point x (pixels)
    camera_cy: 360.0           # Principal point y (pixels)

    # Frame IDs
    camera_frame_id: "camera"  # Camera/image coordinate frame
    lidar_frame_id: "camera_init"  # FAST-LIO global coordinate frame
