# JointStatePublisher publish
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/default/model/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/front_industrial_camera/image"
  gz_topic_name: "/world/default/model/link/front_industrial_camera/sensor/front_industrial_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/livox/lidar"
  gz_topic_name: "/world/default/model/link/front_mid70/sensor/front_mid70_lidar/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/livox/imu"
  gz_topic_name: "/world/default/model/link/front_mid70/sensor/front_mid70_imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/front_industrial_camera/camera_info"
  gz_topic_name: "/world/default/model/link/front_industrial_camera/sensor/front_industrial_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: "GZ_TO_ROS"
