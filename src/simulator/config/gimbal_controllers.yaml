simulator:
  ros__parameters:
    use_sim_time: true

# Gazebo ROS2 Control configuration
gimbal_controllers:
  ros__parameters:
    update_rate: 100
    controller_manager:
      ros__parameters:
        update_rate: 100

    # Pan joint controller (PID velocity controller)
    pan_controller:
      ros__parameters:
        controller:
          module: gazebo_controllers
          class: JointTrajectoryController
        joint: pan_joint
        state_publish_period: 0.01
        action_monitor_period: 0.1
        allow_partial_joints_goal: false
        constraints:
          stopped_velocity_tolerance: 0.01
          goal_time: 0.0
          pan_joint:
            trajectory: 0.1
            goal: 0.1

    # Tilt joint controller (PID velocity controller)
    tilt_controller:
      ros__parameters:
        controller:
          module: gazebo_controllers
          class: JointTrajectoryController
        joint: tilt_joint
        state_publish_period: 0.01
        action_monitor_period: 0.1
        allow_partial_joints_goal: false
        constraints:
          stopped_velocity_tolerance: 0.01
          goal_time: 0.0
          tilt_joint:
            trajectory: 0.1
            goal: 0.1
