ign_sim_pointcloud_tool:
  ros__parameters:
    pcd_topic: livox/lidar
    n_scan: 32
    horizon_scan: 1875
    ang_bottom: 7.0
    ang_res_y: 1.84375  # (7+52) / 32

fast_lio:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./test.pcd"

    common:
      lid_topic:  "/livox/lidar"
      imu_topic:  "/livox/imu"
      time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
      time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

    preprocess:
      lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
      scan_line: 6
      blind: 4.0

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree:    90.0
      det_range:     450.0
      extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
      extrinsic_T: [ 0.04165, 0.02326, -0.0284 ]
      extrinsic_R: [ 1., 0., 0.,
                  0., 1., 0.,
                  0., 0., 1.]

  publish:
      path_en:  false
      scan_publish_en:  true       # false: close all the point cloud output
      dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
      scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

  pcd_save:
      pcd_save_en: true
      interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

lidar_detector_node:
  ros__parameters:
    # Sensor topic configuration
    # input point cloud topic from LiDAR/fastlio
    input_pc_topic: "/cloud_registered"
    
    # output detected objects topic (3D detections with bbox and confidence)
    output_detections_topic: "/lidar_detections"
    
    # DBSCAN clustering parameters
    # eps: radius of neighborhood (in meters)
    # Points within this distance are considered neighbors
    dbscan_eps: 0.5
    
    # min_pts: minimum number of points to form a dense region
    # A point is a core point if it has at least min_pts neighbors
    dbscan_min_pts: 5

    # Heuristic confidence scale: larger values make confidence rise slower
    confidence_point_scale: 25.0

fusion_node:
  ros__parameters:
    # Topic subscriptions and publications
    topics:
      detections_2d: "/detections_2d"      # Input: 2D detections from detector
      detections_3d: "/detections_3d"      # Input: 3D detections from LiDAR
      tracks_2d: "/tracks_2d"              # Output: 2D tracks from ByteTrack
      tracks_3d: "/tracks_3d"              # Output: 3D tracks from AB3DMOT

    # Camera intrinsics (3x3 K matrix, row-major order)
    # K = [fx, 0, cx, 0, fy, cy, 0, 0, 1]
    # Typical values for image resolution 640x480
    camera_K: [640.0, 0.0, 320.0, 0.0, 640.0, 240.0, 0.0, 0.0, 1.0]

    # Fusion parameters
    fusion_iou_threshold: 0.3  # IoU threshold for associating 2D and 3D detections

    # ByteTrack (2D tracking) parameters
    bytetrack_high_conf_threshold: 0.5   # Confidence threshold for high confidence detections
    bytetrack_low_conf_threshold: 0.1    # Confidence threshold for low confidence detections
    bytetrack_iou_threshold: 0.3         # IoU threshold for matching

    # AB3DMOT (3D tracking) parameters
    ab3dmot_high_conf_threshold: 0.5   # Confidence threshold for high confidence detections
    ab3dmot_low_conf_threshold: 0.1    # Confidence threshold for low confidence detections
    ab3dmot_mahal_threshold: 9.4877    # Mahalanobis distance threshold (chi-squared for 7-DOF)
